name: Claude

# 이슈·PR에 @claude 코멘트를 남기면 Claude가 실제로 분석·구현·리뷰해요.
# 준비물(사람): 저장소에 Claude GitHub App 설치(https://github.com/apps/claude) +
#   Settings → Secrets and variables → Actions 에 ANTHROPIC_API_KEY 추가.
# 참고: issue_comment/issues 트리거는 기본 브랜치(main)에 머지된 뒤에야 동작해요.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # @claude 멘션이 있을 때만 실행 (불필요한 러너 소모 방지)
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event.comment && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
