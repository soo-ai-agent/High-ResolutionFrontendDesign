name: Claude

# 이슈·PR에 @claude 코멘트를 남기면 Claude가 실제로 분석·구현·리뷰해요.
#
# 인증(과금) — 시크릿 둘 중 하나만 등록하면 돼요 (둘 다 있으면 구독 토큰 우선):
#   CLAUDE_CODE_OAUTH_TOKEN : Claude Pro/Max **구독 요금제**로 사용.
#     내 컴퓨터에서 `claude setup-token` 실행(구독 계정 로그인) → 나온 토큰을 시크릿으로 등록.
#   ANTHROPIC_API_KEY       : API 키 **종량제**로 사용.
#
# 실행 위치 — 기본은 GitHub 클라우드 러너. **로컬(내 머신) 실행**으로 바꾸려면:
#   1) Settings → Actions → Runners → New self-hosted runner 로 내 머신에 러너 설치·기동
#   2) Settings → Secrets and variables → Actions → Variables 에 CLAUDE_RUNNER=self-hosted 등록
#   ⚠ 공개 저장소 + self-hosted 러너 조합은 위험해요(외부인이 코멘트로 내 머신에서 코드 실행).
#      비공개 저장소에서만 쓰세요. 아래 author_association 가드는 그 방어선이에요.
#
# 준비물(사람): 저장소에 Claude GitHub App 설치(https://github.com/apps/claude) + 위 시크릿.
# 참고: issue_comment/issues 트리거는 기본 브랜치(main)에 머지된 뒤에야 동작해요.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  claude:
    # @claude 멘션 + 쓰기 권한자(OWNER/MEMBER/COLLABORATOR)일 때만 실행
    # — 러너 소모 방지 + 외부인이 멘션으로 에이전트(특히 로컬 러너)를 부리는 것 차단
    if: >
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)) ||
      (github.event.comment && contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ vars.CLAUDE_RUNNER || 'ubuntu-latest' }} # CLAUDE_RUNNER=self-hosted → 로컬 실행
    steps:
      - uses: anthropics/claude-code-action@v1
        with:
          # 구독 토큰(요금제)이 있으면 그걸로, 없으면 API 키(종량제)로 — 둘 다 전달돼 충돌하지 않게
          # 구독 토큰 존재 시 API 키는 비워 보내요.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
