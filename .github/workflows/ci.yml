name: CI

# 타입체크 + 빌드. 결과(workflow_run)는 웹훅으로 미러에 반영돼요(배포·웹훅 연결 시).
# 지금 package.json 에 있는, 실제로 통과하는 것만 실행해요(lint·test 스크립트는 없음).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm build
