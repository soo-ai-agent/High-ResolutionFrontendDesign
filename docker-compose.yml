# Agent Flow — Docker Hub 이미지로 서버에서 실행해요.
#   1) 같은 폴더에 .env 를 만들어 값 채우기 (DOCKERHUB_IMAGE, GITHUB_WEBHOOK_SECRET, API 키)
#   2) docker compose up -d   →  http://<서버>:8443
#   3) GitHub 웹훅 수신을 위해 리버스 프록시(HTTPS 도메인) 뒤에 8443 을 두세요.
services:
  agent-flow:
    image: ${DOCKERHUB_IMAGE:-YOUR_DOCKERHUB_ID/agent-flow:latest}
    container_name: agent-flow
    ports:
      - "8443:8443"
    volumes:
      - agentflow-data:/data # H2 파일 DB · E2E 캡처 영속
    environment:
      PORT: "8443"
      MIRROR_DATA_DIR: /data
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-} # 웹훅 서명 검증 — 운영 필수
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-} # 문서·작업 분해 에이전트 (권장)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-} # 폴백 LLM (선택)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-} # PAT 미연결 시 규칙·스킬 동기화 폴백 (선택)
      # 이메일 알림 발신 서버 (선택) — 받는 주소는 설정 › 외부 알림 채널에서
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # 운영 Postgres 전환 시 주석 해제:
      # SPRING_PROFILES_ACTIVE: prod
      # DATABASE_URL: postgres://user:pass@host:5432/db
    restart: unless-stopped

volumes:
  agentflow-data:
