server:
  port: ${PORT:8443}
  address: 0.0.0.0
  error:
    # ResponseStatusException 의 reason(한국어 안내)을 에러 응답 body 에 포함 —
    # 프론트가 사용자에게 행동 가능한 메시지를 보여줄 수 있게.
    include-message: always

spring:
  application:
    name: agentflow-backend
  # 기본(로컬/검증): H2 파일 DB. 운영은 prod 프로파일에서 Postgres.
  datasource:
    url: jdbc:h2:${MIRROR_DATA_DIR:./.data}/agentflow;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# 앱 설정
agentflow:
  github-api-base: ${GITHUB_API_BASE:https://api.github.com}
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  # 로컬 브리지 — Actions 없이 서버 머신에서 claude CLI 를 직접 실행하는 모드의 설정.
  bridge-git-base: ${BRIDGE_GIT_BASE:https://github.com}
  bridge-command: ${BRIDGE_COMMAND:}

---
# prod: DataSource 는 DataSourceConfig 빈이 DATABASE_URL(jdbc 또는 postgres:// DSN)에서 구성해요.
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: update  # dialect 는 연결에서 자동 감지 (PostgreSQL)
